version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: trustflow_user
      POSTGRES_PASSWORD: trustflow_password
      POSTGRES_DB: trustflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustflow_user -d trustflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: apps/ml-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_ENV=production

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://trustflow_user:trustflow_password@postgres:5432/trustflow_db
      - JWT_SECRET=super_secret_jwt_key_123
      - ML_SERVICE_URL=http://ml-service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

volumes:
  pgdata:
