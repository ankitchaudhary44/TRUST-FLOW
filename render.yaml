services:
  - type: web
    name: trustflow-api
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed && cd apps/api && npm run build
    startCommand: cd apps/api && npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        value: super_secret_jwt_key_123
      - key: ML_SERVICE_URL
        value: https://trustflow-ml.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: trustflow-ml
    env: python
    plan: free
    buildCommand: cd apps/ml-service && pip install -r requirements.txt
    startCommand: cd apps/ml-service && gunicorn app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
